<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — {{displayName}} | SecureAuth</title>
  <meta name="description" content="Your personal SecureAuth dashboard. Welcome, {{displayName}}!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-dark:   #07080f;
      --bg-card:   rgba(255,255,255,0.04);
      --bg-card2:  rgba(255,255,255,0.025);
      --border:    rgba(255,255,255,0.09);
      --accent:    #4f46e5;
      --accent-2:  #7c3aed;
      --success:   #10b981;
      --text-pri:  #f1f1f3;
      --text-sec:  #9ca3af;
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-pri); }

    /* ── Background ── */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 55% at 10% 5%, rgba(16,185,129,.18) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 90% 90%, rgba(79,70,229,.22) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(124,58,237,.1) 0%, transparent 50%);
    }

    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .5; pointer-events: none; z-index: 0; animation: drift 16s ease-in-out infinite alternate; }
    .orb-1 { width: 380px; height: 380px; background: rgba(16,185,129,.35); top:-80px; left:-80px; }
    .orb-2 { width: 340px; height: 340px; background: rgba(79,70,229,.35); bottom:-60px; right:-60px; animation-delay:-7s; }

    .grid-overlay {
      position: fixed; inset: 0; z-index: 0; opacity: .14;
      background-image: linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
      background-size: 48px 48px;
    }

    @keyframes drift { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(25px,20px) scale(1.05);} }

    /* ── Layout ── */
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Navbar ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 2.5rem;
      background: rgba(255,255,255,.03);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      animation: fadeDown .5s ease both;
    }

    @keyframes fadeDown { from{opacity:0;transform:translateY(-12px);} to{opacity:1;transform:translateY(0);} }

    .nav-brand { display: flex; align-items: center; gap: .65rem; }
    .nav-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg,var(--accent),var(--accent-2));
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }
    .nav-name { font-size: 1.1rem; font-weight: 700; background: linear-gradient(135deg,#fff 30%,#a5b4fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

    .nav-right { display: flex; align-items: center; gap: 1rem; }

    .badge-active {
      font-size: .75rem; font-weight: 600; color: #6ee7b7;
      background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.3);
      border-radius: 999px; padding: .28rem .75rem;
      display: flex; align-items: center; gap: .4rem;
    }

    .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #10b981; animation: blink 1.5s ease infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }

    .btn-logout {
      font-size: .85rem; font-weight: 600; color: #f87171;
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.25);
      border-radius: 10px; padding: .45rem 1rem;
      text-decoration: none; transition: all .2s;
      display: flex; align-items: center; gap: .4rem;
    }
    .btn-logout:hover { background: rgba(239,68,68,.22); transform: translateY(-1px); }

    /* ── Main content ── */
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }

    .dashboard-wrap { max-width: 820px; width: 100%; }

    /* ── Welcome card ── */
    .welcome-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 60px rgba(16,185,129,.1), 0 32px 64px rgba(0,0,0,.5);
      animation: slideUp .6s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes slideUp { from{opacity:0;transform:translateY(28px);} to{opacity:1;transform:translateY(0);} }

    .user-info {
      display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .avatar-wrap { position: relative; flex-shrink: 0; }

    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      border: 3px solid rgba(16,185,129,.6);
      box-shadow: 0 0 24px rgba(16,185,129,.3);
      object-fit: cover;
    }

    .avatar-badge {
      position: absolute; bottom: 2px; right: 2px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #10b981;
      border: 2.5px solid var(--bg-dark);
      display: flex; align-items: center; justify-content: center;
      font-size: .65rem;
    }

    .user-text { flex: 1; }

    .welcome-label {
      font-size: .82rem; font-weight: 500; color: #6ee7b7;
      letter-spacing: .08em; text-transform: uppercase; margin-bottom: .35rem;
    }

    .user-name {
      font-size: 2rem; font-weight: 800; line-height: 1.1;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, #ffffff 40%, #a7f3d0 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: .4rem;
    }

    .user-email { font-size: .9rem; color: var(--text-sec); display: flex; align-items: center; gap: .4rem; }
    .user-email svg { flex-shrink: 0; }

    /* ── Success banner ── */
    .success-banner {
      display: flex; align-items: center; gap: 1rem;
      background: rgba(16,185,129,.1);
      border: 1px solid rgba(16,185,129,.25);
      border-radius: 14px;
      padding: 1rem 1.25rem;
    }

    .success-icon { font-size: 1.5rem; flex-shrink: 0; }

    .success-text { }
    .success-title { font-size: .95rem; font-weight: 600; color: #6ee7b7; margin-bottom: .15rem; }
    .success-sub   { font-size: .82rem; color: var(--text-sec); }

    /* ── Stat cards ── */
    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      animation: slideUp .7s cubic-bezier(.16,1,.3,1) .1s both;
    }

    .stat-card {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 18px; padding: 1.4rem 1.5rem;
      transition: transform .2s, box-shadow .2s;
    }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.4); }

    .stat-label { font-size: .78rem; font-weight: 500; color: var(--text-sec); text-transform: uppercase; letter-spacing: .07em; margin-bottom: .6rem; display: flex; align-items: center; gap: .4rem; }

    .stat-value { font-size: 1.4rem; font-weight: 700; }
    .stat-value.green { color: #6ee7b7; }
    .stat-value.blue  { color: #93c5fd; }
    .stat-value.purple{ color: #c4b5fd; }

    /* ── Provider tag ── */
    .provider-tag {
      margin-top: 1rem; padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: .82rem; color: var(--text-sec);
      display: flex; align-items: center; gap: .5rem;
    }

    .google-badge {
      display: inline-flex; align-items: center; gap: .35rem;
      background: #fff; color: #1f1f1f;
      font-size: .78rem; font-weight: 600;
      border-radius: 999px; padding: .22rem .65rem;
    }
    .google-badge svg { width: 14px; height: 14px; }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="page">

    <!-- Navbar -->
    <nav role="banner">
      <div class="nav-brand">
        <div class="nav-icon" aria-hidden="true">🔐</div>
        <span class="nav-name">SecureAuth</span>
      </div>
      <div class="nav-right">
        <span class="badge-active">
          <span class="dot-live" aria-hidden="true"></span>
          Authenticated
        </span>
        <a id="btn-logout" href="/logout" class="btn-logout" aria-label="Sign out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </a>
      </div>
    </nav>

    <!-- Main -->
    <main class="main" role="main">
      <div class="dashboard-wrap">

        <!-- Welcome Card -->
        <div class="welcome-card" role="region" aria-label="User profile">
          <div class="user-info">
            <div class="avatar-wrap">
              <img id="user-avatar" class="avatar" src="{{photo}}" alt="Profile photo of {{displayName}}" />
              <div class="avatar-badge" aria-label="Verified">✓</div>
            </div>
            <div class="user-text">
              <p class="welcome-label">Signed in as</p>
              <h1 class="user-name">{{displayName}}</h1>
              <p class="user-email">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,12 2,6"/>
                </svg>
                {{email}}
              </p>
            </div>
          </div>

          <!-- Success Banner -->
          <div class="success-banner" role="status" aria-live="polite">
            <div class="success-icon" aria-hidden="true">🎉</div>
            <div class="success-text">
              <p class="success-title">Authentication successful!</p>
              <p class="success-sub">You are now securely logged in via Google OAuth 2.0. Your session is encrypted and protected.</p>
            </div>
          </div>

          <!-- Provider -->
          <div class="provider-tag">
            Authenticated via
            <span class="google-badge">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
              Google Sign-In
            </span>
          </div>
        </div>

        <!-- Stats Grid -->
        <div class="stat-grid" role="region" aria-label="Session statistics">

          <div class="stat-card">
            <div class="stat-label">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Session
            </div>
            <div class="stat-value green" id="session-time">Active</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Security
            </div>
            <div class="stat-value blue">OAuth 2.0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 5.55 5.55l1.09-1.09a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 21.27 14z"/></svg>
              Provider
            </div>
            <div class="stat-value purple">Google</div>
          </div>

        </div>

      </div>
    </main>

  </div>

  <script>
    // Show live session timer
    const start = Date.now();
    function updateTimer() {
      const s = Math.floor((Date.now() - start) / 1000);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      document.getElementById('session-time').textContent =
        m > 0 ? `${m}m ${sec}s` : `${sec}s`;
    }
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
